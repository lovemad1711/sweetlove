{% extends "base.html" %}

{% block title %}품목 추가 - 술음료 재고관리 시스템{% endblock %}

{% block content %}
<div class="page-header">
    <h1>품목 추가</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="name">품목명 *</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="units_per_box">박스당 수량 *</label>
        <input type="number" id="units_per_box" name="units_per_box" min="1" required>
    </div>

    <div class="form-group">
        <label for="unit_price">개별 판매 단가 (원) *</label>
        <input type="number" id="unit_price" name="unit_price" min="0" step="0.01" required>
    </div>

    <div class="form-group">
        <label for="notes">비고</label>
        <textarea id="notes" name="notes" rows="3"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">추가</button>
        <a href="{{ url_for('products') }}" class="btn btn-secondary">취소</a>
    </div>
</form>
{% endblock %}
